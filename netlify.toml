[build]
  publish = "."

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Compatibility: existing GitHub Pages root-relative navigation.
[[redirects]]
  from = "/heartagram-italia/*"
  to = "/:splat"
  status = 301

